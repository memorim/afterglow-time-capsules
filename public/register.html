<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Создать аккаунт · Afterglow</title>
  <link rel="stylesheet" href="register.css">
  <script src="register.js" defer></script>
</head>
<body>
  <main>
    <h1>Ваш аккаунт Afterglow</h1>
    <p>Создайте аккаунт для капсул. Сохраните имя и ключ входа в менеджере паролей.</p>
    <button id="register" type="button">Создать аккаунт</button>
    <p role="status"></p>
    <section id="credentials" hidden>
      <label>Имя аккаунта<input readonly id="username"></label>
      <label>Ключ входа<input readonly id="password"></label>
      <a href="./">Открыть капсулы</a>
    </section>
  </main>
</body>
</html>
